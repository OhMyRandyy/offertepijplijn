<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>In aanbouw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&display=swap">
<style>
:root { --bg: #063c42; --fg: #e3f1f2; --muted: #8fbfc4; --lime: #93d400; --line: rgba(255,255,255,.14); }
@media (prefers-color-scheme: light) { :root { --bg: #eef3f4; --fg: #0f2629; --muted: #5f777b; --lime: #3e7d00; --line: #d3dfe0; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: "Urbanist", "Century Gothic", "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
main { max-width: 34rem; text-align: center; display: grid; gap: 18px; justify-items: center; }
.bar { width: 120px; height: 10px; border-radius: 999px; background: repeating-linear-gradient(-45deg, var(--lime) 0 10px, transparent 10px 20px); border: 1px solid var(--line); }
h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
p { margin: 0; color: var(--muted); font-size: 1.1rem; line-height: 1.5; }
@media (prefers-reduced-motion: no-preference) {
  .bar { background-size: 28px 28px; animation: schuif 1.2s linear infinite; }
  @keyframes schuif { to { background-position: 28px 0; } }
}
</style>
</head>
<body>
<main>
  <div class="bar" aria-hidden="true"></div>
  <h1>Under construction</h1>
  <p>Deze website is in aanbouw. Binnenkort meer.</p>
</main>
</body>
</html>
